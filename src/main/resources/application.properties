spring.application.name=nagasibai-rahim-student-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studentuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studentpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
