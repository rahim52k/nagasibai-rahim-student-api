services:
  app:
    image: nagasibai-rahim-student-api:v1.0-rahim
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagasibai-rahim-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentsdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-studentuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-studentpass}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nagasibai-rahim-net
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: nagasibai-rahim-db
    environment:
      POSTGRES_DB: studentsdb
      POSTGRES_USER: ${POSTGRES_USER:-studentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studentpass}
    volumes:
      - nagasibai_rahim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nagasibai-rahim-net
    restart: unless-stopped

volumes:
  nagasibai_rahim_pgdata:

networks:
  nagasibai-rahim-net:
    name: nagasibai-rahim-network
